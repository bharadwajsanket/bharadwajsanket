  <line x1="700" y1="10" x2="700" y2="14" stroke="#1C1C1F" stroke-width="0.6"/>
  <line x1="200" y1="9" x2="200" y2="15" stroke="#1C1C1F" stroke-width="0.5"/>
  <line x1="600" y1="9" x2="600" y2="15" stroke="#1C1C1F" stroke-width="0.5"/>
  <!-- Hidden: tiny 'null' encoded in tick gap pattern — subtle visual -->
  <line x1="380" y1="10" x2="380" y2="14" stroke="#1C1C1F" stroke-width="0.4" opacity="0.5"/>
  <line x1="420" y1="10" x2="420" y2="14" stroke="#1C1C1F" stroke-width="0.4" opacity="0.5"/>
